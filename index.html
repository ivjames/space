<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Space">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <title>Space</title>
</head>
<body>
  <div id="app">
    <div id="update" hidden role="button" tabindex="0">Update ready — tap to reload</div>
    <header id="hud"></header>
    <main id="screen"></main>
    <footer id="actions"></footer>
  </div>

  <script>
  // Stamped with the deployed commit by `space deploy`; 'dev' otherwise.
  const BUILD = 'dev';
  window.__BUILD = BUILD;
    // Register service worker over http(s), not file://
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        // A deploy ships a new sw.js (its cache name carries the commit);
        // once that worker has precached the new build and claimed this
        // page, `controllerchange` fires. Offer the reload rather than
        // forcing it: a launch may be playing, and the save is already on
        // disk, so the tap costs nothing but the animation. On the very
        // first install there was no controller before, and this page
        // already came from the network, so there is nothing to offer.
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController) return;
          const el = document.getElementById('update');
          if (!el) return;
          el.hidden = false;
          const reload = () => location.reload();
          el.addEventListener('click', reload);
          el.addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' || ev.key === ' ') reload();
          });
        });
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
